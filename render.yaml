services:
  - type: web
    name: nmt-english-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python main.py

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: BOT_TOKEN
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: ADMIN_USERNAME
        sync: false

      - key: WEB_APP_URL
        sync: false

      - key: WEBHOOK_SECRET
        sync: false
